name: a浏览器内核验证

# 按 生产环境-12.9-148内核.xlsx 验证全部项目，并生成 Excel 报告。
# 验证目标：团队 213505445724246 内的「UA152」分身（分身浏览器 CDP 端口 9221），
# 断言其 UA 含 Chromium 152 内核（Chrome/152.）。
#
# 真实跑（非 smoke）：每个平台在 GitHub 托管 runner 上
#   1) 下载并安装对应平台的花漾客户端（参考 Windows10.yml / Linux.yml / macOS.yml / Windows7-docker.yml）
#   2) node modifyMain.js —— 给客户端 main.js 注入 remoteDebugPort=9221 + 假媒体开关
#      （该端口在「打开分身」时作为 --remote-debugging-port 传给「分身内核浏览器」；
#        注意：命令行不可再给主壳加 --remote-debugging-port，否则主壳会抢占 9221）
#   3) node tests/e2e-verify.cjs —— WDIO(chromedriver 108) 驱动主壳做 UI：
#      登录 → 分身列表 → 打开目标分身 → 等「正在访问」
#   4) 同一脚本内再跑 node tests/runner.mjs --cdp http://127.0.0.1:9221（puppeteer 连**分身内核**），
#      按矩阵逐项判定（152 内核 UA / 指纹站等），产出 results-<平台>.json
#   5) report job 合并生成 report.xlsx
#
# Windows 7 特殊说明：GitHub 无 Win7 托管 runner，单独用 Docker 方案
#   （参考 Windows7-docker.yml：ubuntu-latest 起 dockurr-windows / Win7 VM，共享目录跑验证）。
#   Win7 VM 内 node 为 node18（最后支持 Win7 的版本），用 puppeteer-core 连 CDP（无需本地 chromium）。
#   该 job 现已随 push / workflow_dispatch / schedule 一同触发（用户要求 SSH push 即覆盖全 5 平台 + 报告）。
on:
  workflow_dispatch:
    inputs:
      software_download_url:
        description: '各平台客户端下载地址（留空则按平台默认；可覆盖单一平台）'
        required: false
      proxy:
        description: '代理地址，如 http://user:pass@host:port'
        required: false
      proxy_ip:
        description: '代理出口公网 IP（WebRTC 一致性判定用）'
        required: false
      cdp_port:
        description: '分身浏览器 CDP 端口（默认 9221，与 matrix meta.cloneCdpPort 一致）'
        default: '9221'
        required: false
      team_id:
        description: '验证目标团队 ID'
        default: '213505445724246'
        required: false
      clone_name:
        description: '验证目标分身名'
        default: 'UA152'
        required: false
      runs_on_override:
        description: '覆盖所有平台的 runs-on（留空=各平台默认 GitHub 托管 runner；填 self-hosted 或具体 label 则全部用该 label）。分身验证需已登录客户端的 runner。'
        required: false
      private_deployment:
        description: 'Win7 Docker 是否从固定 OSS 地址加载镜像/ISO（私有部署）。仅影响 Windows 7 (Docker) job。'
        required: false
        default: false
        type: boolean
      debug_hold:
        description: '调试模式：开 CDP/noVNC 公网隧道 + 打开分身后暂停挂起（不跑验证，等人连上去调试）。'
        required: false
        default: false
        type: boolean
      debug_hold_minutes:
        description: '调试挂起时长（分钟，默认 30，上限 300）。挂起期间可随时取消 job 结束调试。'
        required: false
        default: '30'
      ui_probe:
        description: '调试模式附加：跑 ui-probe.cjs 探测主壳详情页 DOM（密码入口/按钮区），产出上传 Cloudinary。'
        required: false
        default: false
        type: boolean
      debug_verify:
        description: '调试验证：单平台跑全项验证（含密码流程），完成后挂起保活不销毁——失败可连 CDP 现场查。全项 PASS 后再手动跑全量。'
        required: false
        default: false
        type: boolean
      debug_platform:
        description: '调试验证的目标平台（默认 win10；可选 ubuntu）。debug_hold/debug_verify 时其它平台全跳过。'
        required: false
        default: 'win10'
        type: string
      skip_win7:
        description: '跳过 Win7 Docker job（默认 true——Win7 搁置中；需验证 Win7 时手动填 false）。'
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '0 9 * * 1' # 每周一 09:00 UTC 自动跑一轮
  # 2026-10-10 用户纠偏：不再 push 自动触发——修复期间每次 push 都起全量验证轮，
  # 违反「调试环境全项通过 → 再合并完整脚本」的顺序，且多轮排队互相 supersede。
  # 全量验证只在 workflow_dispatch（手动）或每周定时执行；调试走 debug_hold 模式。

permissions:
  contents: read
  actions: write

# 2026-10-10 教训：每次 push 都触发新 run，多轮并行时多台 runner 同时开同一分身
# （互相踢「继续访问」+ 争抢分身 Webshare 代理 → cookie-sync ERR_PROXY_CONNECTION_FAILED）。
# 同一时刻只允许一轮完整验证（5 平台 + cookie 同步 + Win7），旧的排队不取消（保留诊断）。
concurrency:
  group: browser-kernel-verify
  cancel-in-progress: false

jobs:
  verify:
    name: 验证 ${{ matrix.platform }}
    # 注：job 级 if 不能引用 matrix/runner（GitHub 求值限制）——
    # 调试模式（debug_hold/debug_verify）的平台筛选下沉到 step 级 if（见各步）：
    # 非 debug_platform 平台的所有 step 在调试模式下全部 skip，等价于该平台不跑。
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: "Windows 10",  os: windows-latest, slug: Windows_10,  client: 'C:\Program Files\HuaYoung\花漾客户端.exe', install: 'win10' }
          - { platform: "macOS arm64", os: macos-14,      slug: macOS_arm64, client: '/Applications/花漾客户端.app/Contents/MacOS/花漾客户端', install: 'mac-arm64' }
          # macos-13 已于 2025-12-04 退役（pin 它会直接失败/永远排不上）；x86_64 改用 macos-15-intel
          - { platform: "macOS x64",   os: macos-15-intel, slug: macOS_x64,   client: '/Applications/花漾客户端.app/Contents/MacOS/花漾客户端', install: 'mac-x64' }
          - { platform: "Ubuntu 22",   os: ubuntu-22.04,   slug: Ubuntu_22,   client: '/opt/花漾客户端/huayoung', install: 'ubuntu' }
          # Windows 7 不走此矩阵（无 GitHub Win7 托管 runner），改由下方 verify-win7 (Docker) job 单独跑
    runs-on: ${{ github.event.inputs.runs_on_override || matrix.os }}
    env:
      CLIENT_BINARY: ${{ matrix.client }}
      TEAM_ID: ${{ github.event.inputs.team_id || '213505445724246' }}
      CLONE_NAME: ${{ github.event.inputs.clone_name || 'UA152' }}
      PROXY: ${{ github.event.inputs.proxy }}
      PROXY_IP: ${{ github.event.inputs.proxy_ip }}
      REMOTE_DEBUG_PORT: ${{ github.event.inputs.cdp_port || '9221' }}
      CLIENT_CDP_ENDPOINT: ${{ secrets.CLIENT_CDP_ENDPOINT || 'http://127.0.0.1:9221' }}
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: 安装依赖
        run: npm install

      # ---------- 按平台安装真实客户端 ----------
      - name: 安装客户端 (Windows)
        if: ((inputs.debug_hold != true && inputs.debug_verify != true) || matrix.install == inputs.debug_platform) && startsWith(matrix.install, 'win')
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ github.event.inputs.software_download_url }}") {
            $dl = "${{ github.event.inputs.software_download_url }}"
          } else {
            if ("${{ matrix.install }}" -eq "win7") {
              $dl = "https://dl.szdamai.com/downloads/win7_app_zh/HuaYoungApp_Win7_12.9.896_zh_setup.exe"
            } else {
              try {
                $v = (Invoke-RestMethod -Uri "https://www.szdamai.com/static.config.json").windows10AppVersion
                $dl = "https://dl.szdamai.com/downloads/win10_app_zh/HuaYoungApp_Win10_${v}_zh_setup.exe"
                Write-Host "线上版本号: $v"
              } catch {
                Write-Warning "取版本号失败，回退固定版本"; $dl = "https://dl.szdamai.com/downloads/win10_app_zh/HuaYoungApp_Win10_12.9.1033_zh_setup.exe"
              }
            }
          }
          Write-Host "下载客户端: $dl"
          for ($i=1; $i -le 5; $i++) {
            try { Invoke-WebRequest -Uri $dl -OutFile "$env:TEMP\hy_setup.exe" -ErrorAction Stop; break }
            catch { Write-Warning "下载失败(第 $i 次)"; Start-Sleep 5 }
          }
          if (-not (Test-Path "$env:TEMP\hy_setup.exe")) { Write-Error "客户端下载失败"; exit 1 }
          Start-Process -FilePath "$env:TEMP\hy_setup.exe" -ArgumentList "/S" -Wait -Verb RunAs
          $p = "C:\Program Files\HuaYoung\花漾客户端.exe"
          $end = (Get-Date).AddMinutes(5)
          while ((Get-Date) -lt $end -and -not (Test-Path $p)) { Start-Sleep 10 }
          Test-Path $p
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\HuaYoung")) {
            New-Item -ItemType Directory -Force -Path "$env:LOCALAPPDATA\Programs\HuaYoung" | Out-Null
          }

      - name: 安装客户端 (Ubuntu)
        if: matrix.install == 'ubuntu' && ((inputs.debug_hold != true && inputs.debug_verify != true) || inputs.debug_platform == 'ubuntu')
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-zenhei libnotify4 xvfb x11-xserver-utils desktop-file-utils
          if [ -z "${{ github.event.inputs.software_download_url }}" ]; then
            # 动态读取线上版本号（与 Windows10 步骤一致），避免写死旧版本导致 404
            ver=$(curl -fsSL https://www.szdamai.com/static.config.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).linuxAppVersion)}catch(e){console.log('12.9.902')}})") || ver="12.9.902"
            dl="https://dl.szdamai.com/downloads/ubuntu_app_zh/HuaYoungApp_Ubuntu_${ver}_zh_setup.deb"
          else
            dl="${{ github.event.inputs.software_download_url }}"
          fi
          echo "下载客户端: $dl"
          for i in 1 2 3 4 5; do
            curl -fSL --retry 3 --retry-delay 5 -o /tmp/hy.deb "$dl" && break
            echo "下载失败(第 $i 次)"; sleep 5
          done
          [ -f /tmp/hy.deb ] || { echo "客户端下载失败"; exit 1; }
          sudo dpkg -i /tmp/hy.deb || sudo apt-get -f install -y
          sudo Xvfb -ac :99 -screen 0 1280x1024x24 > /dev/null 2>&1 &
          mkdir -p ~/.config/HuaYoung
          # 客户端安装到 /opt（root 属主）：放开 main.js 所在资源的写权限，否则 modifyMain.js 注入
          # remoteDebugPort 会 EACCES 失败 → 分身内核不会带 --remote-debugging-port=9221 → CDP 连不上。
          # Linux 客户端可能用 app.asar（打包）或 resources/app（解包）两种布局，都处理。
          if [ -f /opt/花漾客户端/resources/app.asar ]; then sudo chmod a+w /opt/花漾客户端/resources/app.asar; fi
          if [ -d /opt/花漾客户端/resources/app ]; then sudo chmod -R a+w /opt/花漾客户端/resources/app; fi

      - name: 安装客户端 (macOS)
        if: (inputs.debug_hold != true && inputs.debug_verify != true) && startsWith(matrix.install, 'mac')
        shell: bash
        run: |
          set -e
          if [ -z "${{ github.event.inputs.software_download_url }}" ]; then
            # 动态读取线上版本号（mac-x64 → macX64AppVersion，mac-arm64 → macArm64AppVersion）
            ver=$(curl -fsSL https://www.szdamai.com/static.config.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log('${{ matrix.install }}'==='mac-x64'?j.macX64AppVersion:j.macArm64AppVersion)})") || ver="12.9.940"
            if [ "${{ matrix.install }}" = "mac-x64" ]; then
              dl="https://dl.szdamai.com/downloads/mac_x64_app_zh/HuaYoungApp_Mac_x64_${ver}_zh_setup.dmg"
            else
              dl="https://dl.szdamai.com/downloads/mac_arm64_app_zh/HuaYoungApp_Mac_arm64_${ver}_zh_setup.dmg"
            fi
          else
            dl="${{ github.event.inputs.software_download_url }}"
          fi
          echo "下载客户端: $dl"
          for i in 1 2 3; do
            curl -L --retry 3 --retry-delay 5 -o /tmp/hy.dmg "$dl" && break
            echo "下载失败(第 $i 次)"; sleep 5
          done
          [ -f /tmp/hy.dmg ] || { echo "客户端下载失败"; exit 1; }
          hdiutil attach /tmp/hy.dmg
          appDir=$(find /Volumes -maxdepth 1 -type d -name "花漾客户端*" | head -n 1)
          [ -n "$appDir" ] || { echo "未找到挂载的客户端卷"; exit 1; }
          sudo cp -R "${appDir}/花漾客户端.app" /Applications/
          hdiutil detach "${appDir}"
          if [ -f "/Applications/花漾客户端.app/Contents/Resources/app.asar" ]; then
            sudo chmod -f a+w /Applications/花漾客户端.app/Contents/Resources/app.asar
          fi
          mkdir -p ~/Library/Application\ Support/HuaYoung

      # ---------- 注入 CDP 端口 + 假媒体开关 ----------
      - name: 修改 main.js (macOS, 需 sudo)
        if: (inputs.debug_hold != true && inputs.debug_verify != true) && startsWith(matrix.install, 'mac')
        continue-on-error: true
        run: sudo node modifyMain.js

      - name: 修改 main.js (其他平台)
        if: ((inputs.debug_hold != true && inputs.debug_verify != true) || matrix.install == inputs.debug_platform) && !startsWith(matrix.install, 'mac')
        continue-on-error: true
        run: node modifyMain.js

      # ---------- 调试模式（不猜测，用户要求 2026-10-10）----------
      # 两种调试形态（均限 Ubuntu、均开 CDP 公网隧道、均以挂起保活收尾——调试环境不许意外关闭）：
      #   debug_hold=true   → 只打开分身（OPEN_CLONE_ONLY）+ 可选 ui_probe，挂起
      #   debug_verify=true → 跑全项验证（14 项+密码流程，走正常 e2e-verify），跑完挂起——
      #                       失败可连 CDP 现场查；全项 PASS 后才手动 dispatch 全量定稿轮
      - name: 开 CDP 调试隧道 (调试平台)
        if: matrix.install == inputs.debug_platform && (inputs.debug_hold == true || inputs.debug_verify == true)
        continue-on-error: true
        run: |
          chmod +x tools/debug-tunnel.sh 2>/dev/null || true
          bash tools/debug-tunnel.sh 9221 ubuntu-cdp

      # debug_hold 模式：只打开分身（OPEN_CLONE_ONLY），不跑验证
      - name: 调试模式打开分身 (不验证)
        if: inputs.debug_hold == true && inputs.debug_verify != true
        timeout-minutes: 20
        env:
          DISPLAY: ${{ matrix.install == 'ubuntu' && ':99' || '' }}
          E2E_PLATFORM: ${{ matrix.platform }}
          TEAM_NAME: ${{ secrets.TEAM_NAME }}
          WDIO_USERNAME: ${{ secrets.WDIO_USERNAME }}
          PRODUCT_WDIO_PASSWORD: ${{ secrets.PRODUCT_WDIO_PASSWORD }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          OPEN_CLONE_ONLY: '1'
        run: node tests/e2e-verify.cjs

      # 调试模式附加：主壳 UI 探测（详情页 DOM/密码入口/按钮区）
      # continue-on-error：探测失败不许杀 job——挂起保活步必须执行（调试环境不能意外关闭）
      - name: UI 探测 (详情页 DOM)
        if: inputs.debug_hold == true && inputs.ui_probe == true
        continue-on-error: true
        timeout-minutes: 15
        env:
          DISPLAY: ${{ matrix.install == 'ubuntu' && ':99' || '' }}
          E2E_PLATFORM: ${{ matrix.platform }}
          TEAM_NAME: ${{ secrets.TEAM_NAME }}
          WDIO_USERNAME: ${{ secrets.WDIO_USERNAME }}
          PRODUCT_WDIO_PASSWORD: ${{ secrets.PRODUCT_WDIO_PASSWORD }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
        run: node tests/ui-probe.cjs


      # 注：chromedriver 不再预置/自动下载 —— e2e-verify.cjs 会显式传
      # `wdio:chromedriverOptions.binary` 指向仓库内 tools/chromedriver/108.0.5359.71/<平台>，
      # 从根上避免 WDIO 去 Chrome for Testing 下载 v108（CfT 只提供 v115+ → 404）。

      # ---------- WDIO 驱动主壳：登录 → 打开目标分身 → 连分身内核浏览器 CDP 跑 14 项 ----------
      # 关键：不要再给客户端命令行加 --remote-debugging-port，否则「主壳(Electron/108)」会抢占 9221，
      #       连上的是主壳而非分身内核（UA 会带 HuaYoung/... Electron/22，且不支持 newPage）。
      #       由 modifyMain.js 注入的 this.remoteDebugPort=9221 在「打开分身」时传给分身内核浏览器。
      - name: 打开分身并验证（连分身内核浏览器 CDP）
        # 普通跑=全平台；调试（hold/verify）= 仅 debug_platform 平台跑（Ubuntu job 曾因缺此条件空跑报红——Run#40）
        if: (inputs.debug_hold != true && inputs.debug_verify != true) || matrix.install == inputs.debug_platform
        shell: bash   # Windows 默认 pwsh 不认 bash 的 `\` 续行符/管道，显式 bash
        timeout-minutes: 30
        env:
          DISPLAY: ${{ matrix.install == 'ubuntu' && ':99' || '' }}
          E2E_PLATFORM: ${{ matrix.platform }}
          TEAM_NAME: ${{ secrets.TEAM_NAME }}
          WDIO_USERNAME: ${{ secrets.WDIO_USERNAME }}
          PRODUCT_WDIO_PASSWORD: ${{ secrets.PRODUCT_WDIO_PASSWORD }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          CLOUDINARY_MASK: ${{ secrets.CLOUDINARY_MASK }}
          WDKU_USERNAME: ${{ secrets.WDKU_USERNAME }}
          WDKU_PASSWORD: ${{ secrets.WDKU_PASSWORD }}
          OUT: results-${{ matrix.slug }}.json
        run: node tests/e2e-verify.cjs

      # 调试挂起（保持隧道在线，Agent 从外网连 CDP 隧道自动探测）；
      # 每 5 分钟重发隧道 URL notice（Agent 轮询 annotations 即可拿到最新链接），到时自动结束。
      - name: 调试挂起 (保持隧道在线, Agent 自动探测)
        if: inputs.debug_hold == true || inputs.debug_verify == true
        run: |
          MINS=${{ inputs.debug_hold_minutes || '30' }}
          [ "$MINS" -gt 300 ] 2>/dev/null && MINS=300
          echo "::notice title=调试挂起::已挂起 ${MINS} 分钟。CDP 隧道 URL 见「调试隧道(ubuntu-cdp 端口9221)」notice"
          for i in $(seq 1 "$MINS"); do
            sleep 60
            if [ $((i % 5)) -eq 0 ]; then
              URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' cf_ubuntu-cdp.log 2>/dev/null | head -1)
              echo "[debug-hold] 已挂起 ${i}/${MINS} 分钟 tunnel=${URL:-未知}"
              [ -n "$URL" ] && echo "::notice title=CDP隧道在线(${i}min)::${URL}"
            fi
          done
          echo "[debug-hold] 挂起结束"

      - uses: actions/upload-artifact@v4
        if: always() && inputs.debug_hold != true && inputs.debug_verify != true
        with:
          name: results-${{ matrix.slug }}
          path: |
            results-${{ matrix.slug }}.json
            screenshot-${{ matrix.slug }}.png
            iphey-*.png
          if-no-files-found: warn

  # ===== Cookie 同步：在另一台电脑（独立 job = 不同 runner 机器）验证登录态同步 =====
  # 前置：verify job 内 password-flow 已完成 wdku.net 登录（Cookie 落到分身云端）。
  verify-cookie-sync:
    name: 验证 Cookie 同步 (第二台设备)
    needs: verify          # 必须等第一台机器登录完成，Cookie 才有同步源
    if: ${{ !cancelled() && inputs.debug_hold != true && inputs.debug_verify != true }}
    runs-on: ubuntu-22.04  # 与 verify 的 Ubuntu job 物理不同机（GitHub 每次分配新 runner）
    env:
      CLIENT_BINARY: /opt/花漾客户端/huayoung
      TEAM_ID: ${{ github.event.inputs.team_id || '213505445724246' }}
      CLONE_NAME: ${{ github.event.inputs.clone_name || 'UA152' }}
      REMOTE_DEBUG_PORT: ${{ github.event.inputs.cdp_port || '9221' }}
      E2E_PLATFORM: Windows 10   # 详情页 UI 与 Win10 一致；runner 本身是 Ubuntu
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: 安装依赖
        run: npm install

      - name: 安装客户端 (Ubuntu)
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-zenhei libnotify4 xvfb x11-xserver-utils desktop-file-utils
          if [ -z "${{ github.event.inputs.software_download_url }}" ]; then
            ver=$(curl -fsSL https://www.szdamai.com/static.config.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).linuxAppVersion)}catch(e){console.log('12.9.902')}})") || ver="12.9.902"
            dl="https://dl.szdamai.com/downloads/ubuntu_app_zh/HuaYoungApp_Ubuntu_${ver}_zh_setup.deb"
          else
            dl="${{ github.event.inputs.software_download_url }}"
          fi
          echo "下载客户端: $dl"
          for i in 1 2 3 4 5; do
            curl -fSL --retry 3 --retry-delay 5 -o /tmp/hy.deb "$dl" && break
            echo "下载失败(第 $i 次)"; sleep 5
          done
          [ -f /tmp/hy.deb ] || { echo "客户端下载失败"; exit 1; }
          sudo dpkg -i /tmp/hy.deb || sudo apt-get -f install -y
          sudo Xvfb -ac :99 -screen 0 1280x1024x24 > /dev/null 2>&1 &
          mkdir -p ~/.config/HuaYoung
          if [ -f /opt/花漾客户端/resources/app.asar ]; then sudo chmod a+w /opt/花漾客户端/resources/app.asar; fi
          if [ -d /opt/花漾客户端/resources/app ]; then sudo chmod -R a+w /opt/花漾客户端/resources/app; fi

      - name: 修改 main.js
        continue-on-error: true
        run: node modifyMain.js

      - name: Cookie 同步验证（第二台设备开同一分身）
        timeout-minutes: 30
        env:
          DISPLAY: ':99'
          E2E_PLATFORM: Windows 10
          TEAM_NAME: ${{ secrets.TEAM_NAME }}
          WDIO_USERNAME: ${{ secrets.WDIO_USERNAME }}
          PRODUCT_WDIO_PASSWORD: ${{ secrets.PRODUCT_WDIO_PASSWORD }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          OUT: results-Cookie_Sync.json
        run: node tests/cookie-sync.cjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-Cookie_Sync
          path: |
            results-Cookie_Sync.json
            cookie-sync-*.png
          if-no-files-found: warn

  verify-win7:
    name: 验证 Windows 7 (Docker)
    # Win7 无 GitHub 托管 runner，用 Docker/VM 方案。
    # 2026-10-10 用户指令：Win7 搁置（skip_win7 输入默认 true；要跑时手动 dispatch 填 false）
    if: inputs.skip_win7 != false && inputs.debug_hold != true && inputs.debug_verify != true
    runs-on: ubuntu-latest
    env:
      TEAM_ID: ${{ github.event.inputs.team_id || '213505445724246' }}
      CLONE_NAME: ${{ github.event.inputs.clone_name || 'UA152' }}
      REMOTE_DEBUG_PORT: ${{ github.event.inputs.cdp_port || '9221' }}
    steps:
      - uses: actions/checkout@v6

      - name: 启动 Win7 Docker 虚拟机 (dockurr-windows)
        env:
          PRIVATE_DEPLOYMENT: ${{ inputs.private_deployment }}
          PRIVATE_DOWNLOAD_DIR: ${{ runner.temp }}/dockurr-windows
        run: |
          # 调试需要：给 VM 加 CDP 端口映射（宿主 9221 -> VM 9221），失败不阻断（无 /dev/kvm 时照样跑）
          if grep -q "9221:9221" win7/docker-compose.yml; then
            echo "9221 映射已存在"
          else
            sed -i 's/- 8006:8006/- 8006:8006\n      - 9221:9221/' win7/docker-compose.yml || true
            echo "已追加 9221 端口映射"
          fi
          cd win7
          bash ./start-docker.sh

      # ---------- Win7 调试隧道（不猜测，实时看 VM 桌面 + 分身 CDP）----------
      # noVNC(8006)：浏览器直接看/操作 VM 桌面——start.bat 卡死时可实时看到 VM 里发生了什么
      # CDP(9221)：分身浏览器远程调试（需 modifyMain 注入的 0.0.0.0 监听生效）
      - name: 开 Win7 调试隧道 (noVNC + CDP)
        continue-on-error: true
        run: |
          bash tools/debug-tunnel.sh 8006 win7-novnc
          bash tools/debug-tunnel.sh 9221 win7-cdp

      - name: 下载 Win7 客户端
        run: |
          if [ -z "${{ inputs.software_download_url }}" ]; then
            # 动态读取线上版本号（windows7AppVersion），避免写死旧版本导致 404
            ver=$(curl -fsSL https://www.szdamai.com/static.config.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).windows7AppVersion)}catch(e){console.log('12.9.896')}})") || ver="12.9.896"
            download_url="https://dl.szdamai.com/downloads/win7_app_zh/HuaYoungApp_Win7_${ver}_zh_setup.exe"
          else
            download_url="${{ inputs.software_download_url }}"
          fi
          for i in 1 2 3 4 5; do
            curl -fSL --retry 3 --retry-delay 5 -o installer.exe "$download_url" && break
            echo "curl 下载失败(第 $i 次)，5 秒后重试..."
            sleep 5
          done
          if [ ! -f installer.exe ]; then echo "错误：installer.exe 下载失败"; exit 1; fi
          if ! file installer.exe | grep -q "executable\|PE32\|PE32+"; then
            echo "错误：installer.exe 类型异常（疑似下载损坏）: $(file installer.exe)"; exit 1
          fi

      - name: 复制仓库文件到虚拟机共享目录 (c:\work)
        run: |
          rm -rf package.json yarn.lock
          find . -type f -not -path "*/\.*" -not -path "./win7/*" -exec rsync --relative {} ./win7/shared/work \;

      - name: 在共享目录安装 puppeteer-core (VM 内 node18/Win7 用，连 CDP 无需本地 chromium)
        working-directory: win7/shared/work
        run: npm install puppeteer-core@21 --no-save

      - name: 复制相关文件到虚拟机共享目录
        run: |
          cd tools
          unzip -o node-v18.20.3-win-x64.zip >/dev/null 2>&1 || true
          cd ../win7
          cp ../tools/Windows6.1-KB3080149-x64.msu ./shared
          cp ../tools/chromedriver/108.0.5359.71/win32/chromedriver.exe ./shared/work/chromedriver.exe
          cp -r ../tools/node-v18.20.3-win-x64 ./shared/node
          cp ../installer.exe ./shared/work
          cp ../win7/shared/start-verify.bat ./shared/start.bat

      - name: 写入 VM 内验证配置 (e2e-env.txt，含登录信息，仅存在于本次 runner 工作区)
        run: |
          cat > win7/shared/work/e2e-env.txt <<EOF
          E2E_PLATFORM=Windows 7
          CLONE_NAME=${CLONE_NAME}
          TEAM_ID=${TEAM_ID}
          REMOTE_DEBUG_PORT=${REMOTE_DEBUG_PORT}
          OUT=results-Windows_7.json
          TEAM_NAME=${{ secrets.TEAM_NAME }}
          WDIO_USERNAME=${{ secrets.WDIO_USERNAME }}
          PRODUCT_WDIO_PASSWORD=${{ secrets.PRODUCT_WDIO_PASSWORD }}
          CLOUDINARY_URL=${{ secrets.CLOUDINARY_URL }}
          CLOUDINARY_MASK=${{ secrets.CLOUDINARY_MASK }}
          WDKU_USERNAME=${{ secrets.WDKU_USERNAME }}
          WDKU_PASSWORD=${{ secrets.WDKU_PASSWORD }}
          EOF
          echo "--- e2e-env.txt (密码已脱敏) ---"
          sed 's/^PRODUCT_WDIO_PASSWORD=.*/PRODUCT_WDIO_PASSWORD=***/' win7/shared/work/e2e-env.txt

      - name: 启动 frpc (可选, 调试用)
        continue-on-error: true
        run: |
          sed -i "s/user = .*/user = ${{ secrets.FRPC_USER }}/g" win7/frpc_16020852.ini
          sed -i "s/remote_port = .*/remote_port = ${{ secrets.FRPC_WIN7_REMOTE_PORT }}/g" win7/frpc_16020852.ini
          cp tools/frpc_linux_amd64 frpc
          chmod +x frpc
          ./frpc -c ./win7/frpc_16020852.ini > /tmp/frpc.log 2>&1 &

      # frpc 日志上传公网（用户要求 2026-10-10）：诊断时免登录看 frp 隧道状态。
      # 等 30s 让 frpc 跑一会儿再传；URL 进 ::notice（b64 防掩码），匿名可读。
      - name: 上传 frpc.log 到公网
        if: always()
        continue-on-error: true
        env:
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
        run: |
          sleep 30
          if [ -f /tmp/frpc.log ]; then
            node -e "
              const cloudinary = require('cloudinary').v2;
              cloudinary.config({ secure: true });
              cloudinary.uploader.upload('/tmp/frpc.log', {
                asset_folder: 'e2eTest_frpc', use_filename: false, unique_filename: false, resource_type: 'raw'
              }).then(r => {
                console.log('::notice title=frpc日志::' + Buffer.from(r.url).toString('base64'));
                console.log('frpc.log uploaded: ' + r.url);
              }).catch(e => { console.log('frpc.log upload failed: ' + e.message); process.exit(0); });
            "
          else
            echo "(无 /tmp/frpc.log)"
          fi

      - name: 等待测试开始
        # Win7 每次都是「从零重装系统」：装机 + OEM + 重启 + 登录自启本身就要十几分钟，属常态，不是缺陷。
        # 真正要盯的是 start.log 出现后 VM 内脚本能不能往下走。这里放宽到 40 分钟并每 30s 打点；
        # 超时则 dump 容器日志 / shared 目录 / oem.log / boots.log 再失败。
        timeout-minutes: 45
        run: |
          deadline=$((SECONDS + 2400)) # 40 分钟
          while [ ! -f "win7/shared/start.log" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Win7 VM 未在 40 分钟内写入 start.log（等待测试开始超时）"
              echo "----- docker ps -a -----"; docker ps -a || true
              echo "----- docker logs windows (tail 300) -----"; docker logs --tail 300 windows 2>&1 || true
              echo "----- win7/shared -----"; ls -la win7/shared || true
              echo "----- win7/shared/oem.log (VM OEM 阶段心跳) -----"; cat win7/shared/oem.log 2>/dev/null || echo "(无 oem.log：VM 尚未跑到 OEM install.bat)"
              echo "----- win7/shared/boots.log (VM 开机脚印) -----"; cat win7/shared/boots.log 2>/dev/null || echo "(无 boots.log)"
              exit 1
            fi
            if [ $((SECONDS % 30)) -lt 10 ]; then
              echo "[${SECONDS}s] 等待 start.log ... 容器: $(docker ps --filter name=windows --format '{{.Status}}' 2>/dev/null || echo '?-') | shared: $(ls win7/shared 2>/dev/null | tr '\n' ' ')"
            fi
            sleep 10
          done
          echo "start.log 已出现（等待 ${SECONDS}s）"
          echo "----- oem.log -----"; cat win7/shared/oem.log 2>/dev/null || echo "(无 oem.log)"
          echo "----- boots.log -----"; cat win7/shared/boots.log 2>/dev/null || echo "(无 boots.log)"
          echo "----- start.log (tail 40) -----"; tail -n 40 win7/shared/start.log || true

      - name: 等待测试完成
        # 每 60s 回显 start.log 尾部：start.log 里每步都有 [时间] 打点，可据此判断
        #   ① 只见表头且时间戳不变 ⇒ VM 内脚本卡住（卡在哪行看最后一条打点）
        #   ② 出现多条表头 ⇒ VM 反复重启（再去 boots.log 数开机次数）
        timeout-minutes: 45
        run: |
          for i in $(seq 1 43); do
            [ -f "win7/shared/done.log" ] && break
            sleep 60
            echo "----- [第 ${i} 分钟] start.log 尾部 -----"
            tail -n 12 win7/shared/start.log 2>/dev/null || echo "(start.log 尚不可读)"
          done
          if [ ! -f "win7/shared/done.log" ]; then
            echo "::error::VM 未在 43 分钟内写完 done.log"
            exit 1
          fi
          echo "测试结束"
          cat win7/shared/start.log

      - name: 收集 Win7 诊断 (始终)
        # 无论成功/失败都落盘，避免「只有超时才发现拿不到证据」（Run#16 就吃了这个亏）。
        if: always()
        continue-on-error: true
        run: |
          echo "===== boots.log (VM 开机脚印，判断是否反复重启) ====="; cat win7/shared/boots.log 2>/dev/null || echo "(无 boots.log)"
          echo "===== oem.log (OEM 装机阶段心跳) ====="; cat win7/shared/oem.log 2>/dev/null || echo "(无 oem.log)"
          echo "===== start.log (VM 内逐步打点) ====="; cat win7/shared/start.log 2>/dev/null || echo "(无 start.log)"
          echo "===== done.log ====="; cat win7/shared/done.log 2>/dev/null || echo "(无 done.log)"
          echo "===== docker ps -a ====="; docker ps -a || true
          echo "===== docker logs windows (全量落盘 win7-docker.log) ====="
          docker logs windows > win7-docker.log 2>&1 || true
          tail -n 400 win7-docker.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win7-diagnostics
          path: |
            win7-docker.log
            win7/shared/boots.log
            win7/shared/oem.log
            win7/shared/start.log
            win7/shared/done.log
          if-no-files-found: ignore

      - name: 取回 Win7 验证结果
        if: always()
        run: |
          FAIL=0
          if [ -f "win7/shared/work/results-Windows_7.json" ]; then
            cp win7/shared/work/results-Windows_7.json results-Windows_7.json
            # VM 内正常跑完时 results 数组非空；为空说明 e2e-verify 在内就挂了
            if ! node -e "const d=require('./results-Windows_7.json'); process.exit(Array.isArray(d.results)&&d.results.length>0?0:1)"; then
              echo "::warning::Win7 results 为空，VM 内验证未真正执行"
              FAIL=1
            fi
          else
            echo "::warning::VM 未生成 results-Windows_7.json，写入空结果占位"
            echo '{"meta":{"kernel":"152","platform":"Windows 7","teamId":"'"$TEAM_ID"'","cloneName":"'"$CLONE_NAME"'"},"platform":"Windows 7","results":[],"fatal":"VM 未生成结果（见 start.log）"}' > results-Windows_7.json
            FAIL=1
          fi
          if [ -f "win7/shared/work/screenshot-Windows_7.png" ]; then
            cp win7/shared/work/screenshot-Windows_7.png screenshot-Windows_7.png || true
          fi
          # iphey 截图（checkers 生成）也一并带回，上传 artifact 留档
          cp win7/shared/work/iphey-*.png . 2>/dev/null || true
          exit $FAIL

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-Windows_7
          path: |
            results-Windows_7.json
            screenshot-Windows_7.png
            iphey-*.png
          if-no-files-found: warn

  report:
    name: 合并生成 Excel 报告
    needs: [verify, verify-cookie-sync, verify-win7]
    # 调试模式不出报告（验证没跑）；关键：只要有任意平台是红（例如 iphey 判 fail、Win7 未产出），
    # report 就会被默认跳过——加 always() 保证无论验证结果如何都能合并出 report.xlsx。
    if: always() && inputs.debug_hold != true && inputs.debug_verify != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: 安装依赖
        run: npm install

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: results-*
          merge-multiple: true

      - name: 生成 Excel 报告
        run: node tests/report.mjs --dir artifacts --out report.xlsx

      - uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: report.xlsx
